services:
  - type: web
    name: foresight-dashboard
    env: python
    buildCommand: pip install -r requirements.txt && python src/run_pipeline.py
    startCommand: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    autoDeploy: false

  - type: web
    name: foresight-api
    env: python
    buildCommand: pip install -r requirements.txt && python src/run_pipeline.py
    startCommand: uvicorn service.api:app --host 0.0.0.0 --port=$PORT
    autoDeploy: false
